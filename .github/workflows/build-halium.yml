name: Build Halium for SNE-LX1 (sydney / Kirin 710)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Kernel fork branch'
        required: false
        default: 'headless-kirin710'
        type: choice
        options:
          - headless-kirin710
          - full-ui-kirin710
      upload_release:
        description: 'Upload as GitHub Release'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build halium-boot.img
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build boot image
        run: bash build-bootimg.sh
        env:
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}

      - name: Resolve upstream rootfs version
        id: rootfs-version
        run: |
          ROOTFS_TAG=$(curl -s https://api.github.com/repos/droidian-images/droidian/releases/latest \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          PATCH_HASH=$(sha256sum patch-rootfs.sh | cut -c1-12)
          echo "cache-key=rootfs-patched-${ROOTFS_TAG}-${PATCH_HASH}" >> "$GITHUB_OUTPUT"

      - name: Cache patched rootfs.img
        id: rootfs-cache
        uses: actions/cache@v4
        with:
          path: rootfs.img
          key: ${{ steps.rootfs-version.outputs.cache-key }}

      - name: Download and patch rootfs.img
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        run: |
          echo "[*] Finding latest Droidian rootfs release..."
          ROOTFS_URL=$(curl -s https://api.github.com/repos/droidian-images/droidian/releases/latest \
            | python3 -c "import sys,json; assets=json.load(sys.stdin)['assets']; print(next(a['browser_download_url'] for a in assets if 'rootfs-api33-arm64' in a['name'] and a['name'].endswith('.zip')))")
          echo "[*] Downloading $ROOTFS_URL..."
          curl -fSL --retry 3 -o rootfs.zip "$ROOTFS_URL"
          echo "[*] Extracting rootfs.img..."
          unzip -o rootfs.zip "data/rootfs.img" -d .
          mv data/rootfs.img rootfs.img
          rm -rf data rootfs.zip
          echo "[*] Patching rootfs for Kirin 710..."
          sudo bash patch-rootfs.sh
          echo "[OK] rootfs.img (patched): $(du -sh rootfs.img | cut -f1)"

      - name: Upload halium-boot.img
        uses: actions/upload-artifact@v4
        with:
          name: halium-boot
          path: halium-boot.img
          retention-days: 60

      - name: Upload rootfs.img
        uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: rootfs.img
          retention-days: 60

      - name: Create GitHub Release
        if: ${{ inputs.upload_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: halium-${{ github.run_number }}
          name: "Halium sydney - Build ${{ github.run_number }}"
          body: |
            ## Halium for Huawei Mate 20 Lite (SNE-LX1 / sydney)

            **Kernel:** 4.9.337 (android@13)

            ### Flash
            ```
            fastboot flash kernel halium-boot.img
            ```
          files: halium-boot.img
          draft: false
          prerelease: true
