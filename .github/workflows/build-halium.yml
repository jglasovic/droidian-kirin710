name: Build halium-boot.img

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Kernel fork branch'
        required: false
        default: 'headless-kirin710'
        type: choice
        options:
          - headless-kirin710
          - full-ui-kirin710
      upload_release:
        description: 'Upload as GitHub Release'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build halium-boot.img
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build boot image
        run: bash build-bootimg.sh
        env:
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}

      - name: Upload halium-boot.img
        uses: actions/upload-artifact@v4
        with:
          name: halium-boot-${{ inputs.kernel_branch }}
          path: halium-boot.img
          retention-days: 60

      - name: Create GitHub Release
        if: ${{ inputs.upload_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: halium-${{ inputs.kernel_branch }}-${{ github.run_number }}
          name: "Halium ${{ inputs.kernel_branch }} - Build ${{ github.run_number }}"
          body: |
            ## Halium for Huawei Mate 20 Lite (SNE-LX1 / sydney)

            **Kernel:** 4.9.337 (android@13)
            **Variant:** ${{ inputs.kernel_branch }}

            ### Flash
            ```
            fastboot flash kernel halium-boot.img
            ```
          files: halium-boot.img
          draft: false
          prerelease: true
