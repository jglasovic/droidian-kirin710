name: Build Halium for SNE-LX1 (sydney / Kirin 710)

# ── Runner requirements ───────────────────────────────────────────────────────
#
#  Job 1 · KERNEL-ONLY   → ubuntu-22.04 (GitHub-hosted, FREE for public repos)
#           2 CPU / 7 GB RAM / ~25 GB disk — enough for a cross-compiled kernel
#
#  Job 2 · FULL-HALIUM   → self-hosted runner  (AOSP needs 16 GB+ RAM, 200 GB+ disk)
#           Setup once on an Ubuntu 22.04 machine:
#             GitHub repo → Settings → Actions → Runners → New self-hosted runner
#             Label the runner:  self-hosted,ubuntu-22.04,kirin710
#
#           Alternative (paid): GitHub larger runners — create one under
#             Settings → Actions → Runners → New GitHub-hosted runner
#             Recommended size: 16-core (64 GB RAM, ~200 GB disk, ~$0.064/min)
#             Then change halium job's runs-on to your larger runner's label.
#
#  Job 3 · DROIDIAN-PACKAGE → ubuntu-22.04 (GitHub-hosted, free, ~10 min)
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [ main, halium-13 ]
    paths:
      - 'device-tree/**'
      - 'kernel-configs/**'
      - '.github/workflows/build-halium.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'What to build'
        required: true
        default: 'kernel-only'
        type: choice
        options:
          - kernel-only
          - full-halium
          - droidian-package
      upload_release:
        description: 'Upload as GitHub Release'
        required: false
        default: false
        type: boolean

env:
  DEVICE:        sydney
  VENDOR:        huawei
  HALIUM_BRANCH: halium-13.0
  KERNEL_REPO:   https://github.com/Huawei-Dev/android_kernel_huawei_kirin710
  # android@13 (4.9.337) matches the kernel running on the device.
  # BALONG_INC handles the Huawei angle-bracket includes (cgroup_pids.h etc.).
  KERNEL_BRANCH: android@13

# ── Job 1: Kernel-only build ─────────────────────────────────────────────────
jobs:
  kernel:
    name: Build Kernel (4.9.337 / kirin710_defconfig)
    # GitHub-hosted runner — free for public repos, enough for a kernel build
    runs-on: ubuntu-22.04
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.build_type == 'kernel-only' ||
      inputs.build_type == 'full-halium'
    outputs:
      kernel_sha: ${{ steps.meta.outputs.sha }}
    env:
      # Keep ccache inside the workspace so actions/cache can persist it.
      # 5 GB fits comfortably on GitHub-hosted runners (~25 GB free disk).
      CCACHE_DIR:  ${{ github.workspace }}/.ccache
      CCACHE_SIZE: 5G

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git bc bison flex libssl-dev make libc6-dev libncurses5-dev \
            crossbuild-essential-arm64 python3 ccache zip unzip curl wget \
            lzop device-tree-compiler

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-kernel-kirin710-${{ github.sha }}
          restore-keys: |
            ccache-kernel-kirin710-

      - name: Configure ccache
        run: |
          ccache --max-size=${{ env.CCACHE_SIZE }}
          ccache --zero-stats

      - name: Checkout kernel source
        run: |
          if [ ! -d kernel/.git ]; then
            git clone --depth=1 -b "${{ env.KERNEL_BRANCH }}" \
              "${{ env.KERNEL_REPO }}" kernel
          else
            git -C kernel fetch --depth=1 origin "${{ env.KERNEL_BRANCH }}"
            git -C kernel checkout FETCH_HEAD
          fi

      - name: Apply Halium defconfig patches
        run: |
          # Copy our patched defconfig (contains Halium additions)
          cp kernel-configs/arch/arm64/configs/kirin710_defconfig \
             kernel/arch/arm64/configs/kirin710_defconfig
          echo "Applied patched kirin710_defconfig"
          grep -c "CONFIG_" kernel/arch/arm64/configs/kirin710_defconfig

      - name: Patch kernel source
        run: |
          # linux/sched/debug.h was split from linux/sched.h upstream but is
          # absent from this vendor tree; the Hi1102 WiFi driver includes it.
          # Stub it out — all relevant declarations are already in linux/sched.h.
          mkdir -p kernel/include/linux/sched
          echo '#ifndef _LINUX_SCHED_DEBUG_H' >  kernel/include/linux/sched/debug.h
          echo '#define _LINUX_SCHED_DEBUG_H'  >> kernel/include/linux/sched/debug.h
          echo '#include <linux/sched.h>'       >> kernel/include/linux/sched/debug.h
          echo '#endif'                         >> kernel/include/linux/sched/debug.h

      - name: Build kernel
        env:
          ARCH:            arm64
          CROSS_COMPILE:   aarch64-linux-gnu-
          CC:              "ccache aarch64-linux-gnu-gcc"
        run: |
          set -o pipefail
          cd kernel
          # BALONG_INC mimics what the AOSP build system passes to the Huawei
          # kernel so that angle-bracket includes like
          #   #include <./cgroup_huawei/cgroup_pids.h>
          # resolve correctly (they live under kernel/cgroup_huawei/, not the
          # default GCC search path).
          KDIR=$(pwd)
          make ARCH=arm64 kirin710_defconfig
          make ARCH=arm64 \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CC="ccache aarch64-linux-gnu-gcc" \
               "BALONG_INC=-I${KDIR}/kernel" \
               KCFLAGS="-Wno-error=maybe-uninitialized" \
               -j$(nproc) Image.gz 2>&1 | tee ../kernel_build.log
          echo "Kernel size: $(du -sh arch/arm64/boot/Image.gz)"

      - name: Output build metadata
        id: meta
        run: |
          echo "sha=$(git -C kernel rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image.gz-${{ steps.meta.outputs.sha }}
          path: |
            kernel/arch/arm64/boot/Image.gz
            kernel_build.log
          retention-days: 30

      - name: ccache stats
        run: ccache --show-stats

# ── Job 2: Full Halium build (AOSP-based) ────────────────────────────────────
  halium:
    name: Build Halium (halium-boot.img + system.img)
    # Needs 16 GB+ RAM and 200 GB+ disk — must be self-hosted (or a GitHub
    # larger runner if you create one under Settings → Actions → Runners).
    runs-on: [self-hosted, ubuntu-22.04, kirin710]
    needs: kernel
    if: |
      github.event_name == 'workflow_dispatch' && inputs.build_type == 'full-halium'
    env:
      # On self-hosted runners /opt persists between runs, giving a warm ccache.
      CCACHE_DIR:  /opt/ccache/kirin710
      CCACHE_SIZE: 50G

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install AOSP build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git-core gnupg flex bison gperf build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc \
            unzip python3 python3-pip python-is-python3 openjdk-11-jdk \
            ccache rsync lzop bc libssl-dev schedtool patchelf \
            libncurses5 device-tree-compiler repo

      - name: Set up repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialise Halium source
        working-directory: ${{ runner.temp }}/halium
        run: |
          mkdir -p ${{ runner.temp }}/halium
          cd ${{ runner.temp }}/halium
          if [ ! -d .repo ]; then
            repo init \
              -u https://github.com/Halium/android \
              -b ${{ env.HALIUM_BRANCH }} \
              --depth=1 --no-clone-bundle
          fi

      - name: Write local manifest
        run: |
          mkdir -p ${{ runner.temp }}/halium/.repo/local_manifests
          cat > ${{ runner.temp }}/halium/.repo/local_manifests/sydney.xml << 'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="gh" fetch="https://github.com/" />

            <project path="kernel/huawei/kirin710"
                     name="Huawei-Dev/android_kernel_huawei_kirin710"
                     remote="gh" revision="android@13" />

            <!-- device/huawei/sydney is populated by the "Copy device tree" step below -->

            <project path="device/huawei/kirin710-9-common"
                     name="Iceows/android_device_huawei_kirin710-9-common"
                     remote="gh" revision="lineage-20" />

            <project path="device/huawei/compat"
                     name="Huawei-Dev/android_device_huawei_compat"
                     remote="gh" revision="main" />

            <project path="vendor/huawei/kirin710-9-common"
                     name="Iceows/android_vendor_huawei_kirin710-9-common"
                     remote="gh" revision="lineage-20" />

            <!-- Sydney ODM vendor blobs (extracted from live SNE-LX1 device) -->
            <project path="vendor/huawei/sydney"
                     name="jglasovic/android_vendor_huawei_sydney"
                     remote="gh" revision="main"
                     clone-depth="1" />
          </manifest>
          XML

      - name: Sync Halium source
        working-directory: ${{ runner.temp }}/halium
        run: |
          repo sync \
            -j$(nproc) -c \
            --no-clone-bundle --no-tags \
            --optimized-fetch --retry-fetches=5

      - name: Copy device tree from this repo
        run: |
          cp -r device-tree/sydney \
            ${{ runner.temp }}/halium/device/huawei/sydney

      - name: Apply patched kernel defconfig
        run: |
          cp kernel-configs/arch/arm64/configs/kirin710_defconfig \
             ${{ runner.temp }}/halium/kernel/huawei/kirin710/arch/arm64/configs/kirin710_defconfig

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-halium-kirin710-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-halium-kirin710-${{ runner.os }}-

      - name: Configure ccache
        run: |
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          ccache --max-size=${{ env.CCACHE_SIZE }}

      - name: Build halium-boot and system image
        working-directory: ${{ runner.temp }}/halium
        env:
          USE_CCACHE: "1"
        run: |
          source build/envsetup.sh
          breakfast ${{ env.DEVICE }}
          mka halium-boot 2>&1 | tee /tmp/build_haliumboot.log
          mka systemimage  2>&1 | tee /tmp/build_systemimage.log

      - name: Collect artifacts
        run: |
          OUT=${{ runner.temp }}/halium/out/target/product/${{ env.DEVICE }}
          mkdir -p artifacts
          cp "$OUT/halium-boot.img"  artifacts/
          cp "$OUT/system.img"       artifacts/
          echo "$(date +%Y%m%d-%H%M)" > artifacts/build_date.txt
          echo "${{ github.sha }}"   > artifacts/git_sha.txt
          ls -lh artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: halium-sydney-${{ github.run_number }}
          path: artifacts/
          retention-days: 60

      - name: Create GitHub Release
        if: ${{ inputs.upload_release == true && github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: halium-${{ github.run_number }}-${{ github.sha }}
          name: "Halium sydney - Build ${{ github.run_number }}"
          body: |
            ## Halium build for Huawei Mate 20 Lite (SNE-LX1 / sydney)

            **Kernel:** 4.9.337 (Kirin 710)
            **Halium branch:** ${{ env.HALIUM_BRANCH }}
            **Build date:** $(cat artifacts/build_date.txt)

            ### Flash instructions
            ```
            fastboot flash boot   halium-boot.img
            fastboot flash system system.img
            ```
            Then flash Droidian rootfs from https://github.com/droidian/droidian/releases

            ### Hardware status
            - WiFi: needs HiSilicon Hi1102 firmware in /lib/firmware/
            - Display: 1080x2340 @ 480dpi
            - Dual SIM: slot1 + slot2
            - NFC: NXP chip via vendor HAL
          files: artifacts/*
          draft: false
          prerelease: true

# ── Job 3: Package Droidian (GitHub-hosted, lightweight) ─────────────────────
  droidian-package:
    name: Package Droidian flashable zip
    runs-on: ubuntu-22.04
    needs: halium
    if: |
      github.event_name == 'workflow_dispatch' && inputs.build_type == 'droidian-package'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download halium artifacts
        uses: actions/download-artifact@v4
        with:
          name: halium-sydney-${{ github.run_number }}
          path: halium-artifacts/

      - name: Download latest Droidian rootfs
        run: |
          DROIDIAN_URL=$(curl -s https://api.github.com/repos/droidian/droidian/releases/latest \
            | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assets = data.get('assets', [])
          for a in assets:
              n = a['name']
              if 'phone' in n and 'arm64' in n and n.endswith('.zip'):
                  print(a['browser_download_url'])
                  break
          ")
          echo "Downloading: $DROIDIAN_URL"
          wget -q "$DROIDIAN_URL" -O droidian-rootfs.zip

      - name: Build flashable package
        run: |
          mkdir -p flashable/META-INF/com/google/android
          cp halium-artifacts/halium-boot.img flashable/
          cp halium-artifacts/system.img       flashable/
          cp droidian-rootfs.zip               flashable/

          cat > flashable/META-INF/com/google/android/updater-script << 'SCRIPT'
          ui_print("Droidian for Huawei Mate 20 Lite (SNE-LX1)");
          ui_print("Flashing halium-boot...");
          package_extract_file("halium-boot.img", "/dev/block/by-name/kernel");
          ui_print("Flashing system...");
          package_extract_file("system.img", "/dev/block/by-name/system");
          ui_print("Done! Now flash droidian-rootfs.zip separately in TWRP.");
          SCRIPT

          cat > flashable/META-INF/com/google/android/update-binary << 'BINARY'
          #!/sbin/sh
          ZIPFILE="$3"
          ui_print() { echo "ui_print $1" > /proc/self/fd/$2; echo "ui_print" > /proc/self/fd/$2; }
          . /tmp/updater-script
          BINARY

          cd flashable
          zip -r ../droidian-sydney-${{ github.run_number }}.zip .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: droidian-sydney-flashable-${{ github.run_number }}
          path: droidian-sydney-${{ github.run_number }}.zip
          retention-days: 90
