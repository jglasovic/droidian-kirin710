name: Build halium-boot.img

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Kernel fork branch'
        required: false
        default: 'headless-kirin710'
        type: choice
        options:
          - headless-kirin710
          - full-ui-kirin710
      upload_release:
        description: 'Upload as GitHub Release'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build halium-boot.img
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install arm64 libs for recovery adbd bundling
        run: |
          sudo dpkg --add-architecture arm64
          # Restrict existing amd64 sources so apt-get update doesn't fetch arm64 from amd64-only mirrors
          sudo sed -i 's/^Types: deb$/Types: deb\nArchitectures: amd64/' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || \
            sudo sed -i 's/^deb http/deb [arch=amd64] http/' /etc/apt/sources.list
          # Add ports.ubuntu.com for arm64 (not on main archive)
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe" \
            | sudo tee /etc/apt/sources.list.d/arm64-ports.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libc6:arm64 libstdc++6:arm64 libgcc-s1:arm64 \
            libbrotli1:arm64 libcap2:arm64 \
            libgcrypt20:arm64 libgpg-error0:arm64 \
            liblz4-1:arm64 liblzma5:arm64 \
            zlib1g:arm64 libzstd1:arm64 \
            libsystemd0:arm64 libprotobuf32t64:arm64

      - name: Build boot image
        run: bash build-bootimg.sh
        env:
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}

      - name: Upload halium-boot.img
        uses: actions/upload-artifact@v4
        with:
          name: halium-boot-${{ inputs.kernel_branch }}
          path: halium-boot.img
          retention-days: 60

      - name: Upload recovery.img
        uses: actions/upload-artifact@v4
        with:
          name: recovery
          path: recovery.img
          retention-days: 60

      - name: Create GitHub Release
        if: ${{ inputs.upload_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: halium-${{ inputs.kernel_branch }}-${{ github.sha }}
          name: "Halium ${{ inputs.kernel_branch }} (${{ github.sha }})"
          body: |
            ## Halium for Huawei Mate 20 Lite (SNE-LX1 / sydney)

            **Kernel:** 4.9.337 (android@13)
            **Variant:** ${{ inputs.kernel_branch }}
            **Commit:** ${{ github.sha }}

            ### Flash
            ```
            fastboot flash kernel halium-boot.img
            fastboot flash recovery_ramdisk recovery.img
            ```
          files: |
            halium-boot.img
            recovery.img
          draft: false
          prerelease: false
