name: Build Halium for SNE-LX1 (sydney / Kirin 710)

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload as GitHub Release'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build halium-boot.img + fetch system.img
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install mkbootimg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends android-tools-mkbootimg

      - name: Build kernel
        run: bash build-kernel.sh

      - name: Build boot image
        run: bash build-bootimg.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: halium-sydney-${{ github.run_number }}
          path: |
            halium-boot.img
            system.img
            kernel_build.log
          retention-days: 60

      - name: Create GitHub Release
        if: ${{ inputs.upload_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: halium-${{ github.run_number }}
          name: "Halium sydney - Build ${{ github.run_number }}"
          body: |
            ## Halium for Huawei Mate 20 Lite (SNE-LX1 / sydney)

            **Kernel:** 4.9.337 (android@13)
            **System:** Halium 13 generic arm64 GSI (UBports CI #836)

            ### Flash
            ```
            fastboot flash kernel  halium-boot.img
            fastboot flash system  system.img
            ```
            Then flash Droidian rootfs from https://github.com/droidian-images/droidian/releases
          files: |
            halium-boot.img
            system.img
          draft: false
          prerelease: true
