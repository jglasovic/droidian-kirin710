name: Build Halium for SNE-LX1 (sydney / Kirin 710)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Kernel fork branch'
        required: false
        default: 'headless-kirin710'
        type: choice
        options:
          - headless-kirin710
          - full-ui-kirin710
      upload_release:
        description: 'Upload as GitHub Release'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build halium-boot.img
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build boot image
        run: bash build-bootimg.sh
        env:
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}

      - name: Download system.img
        run: |
          echo "[*] Downloading system.img from own release..."
          curl -fSL --retry 3 -o system.img \
            "https://github.com/${{ github.repository }}/releases/download/upstream-images/system.img"
          echo "[OK] system.img: $(du -sh system.img | cut -f1)"

      - name: Download rootfs.img
        run: |
          echo "[*] Downloading rootfs.img from own release..."
          curl -fSL --retry 3 -o rootfs.img \
            "https://github.com/${{ github.repository }}/releases/download/upstream-images/rootfs.img"
          echo "[OK] rootfs.img: $(du -sh rootfs.img | cut -f1)"

      - name: Upload halium-boot.img
        uses: actions/upload-artifact@v4
        with:
          name: halium-boot
          path: halium-boot.img
          retention-days: 60

      - name: Upload system.img
        uses: actions/upload-artifact@v4
        with:
          name: system
          path: system.img
          retention-days: 60

      - name: Upload rootfs.img
        uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: rootfs.img
          retention-days: 60

      - name: Create GitHub Release
        if: ${{ inputs.upload_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: halium-${{ github.run_number }}
          name: "Halium sydney - Build ${{ github.run_number }}"
          body: |
            ## Halium for Huawei Mate 20 Lite (SNE-LX1 / sydney)

            **Kernel:** 4.9.337 (android@13)

            ### Flash
            ```
            fastboot flash kernel halium-boot.img
            ```

            For system.img and rootfs, download the Droidian image from:
            https://github.com/droidian-images/droidian/releases
          files: halium-boot.img
          draft: false
          prerelease: true
