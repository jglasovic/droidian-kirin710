name: Update upstream images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    name: Mirror upstream system.img & rootfs.img
    runs-on: ubuntu-24.04

    steps:
      - name: Download halium system archive from UBports CI
        run: |
          echo "[*] Downloading halium_halium_arm64.tar.xz from UBports CI..."
          curl -fSL --retry 3 -o halium_arm64.tar.xz \
            "https://ci.ubports.com/job/UBportsCommunityPortsJenkinsCI/job/ubports%252Fporting%252Fcommunity-ports%252Fjenkins-ci%252Fgeneric_arm64/job/halium-13.0/lastSuccessfulBuild/artifact/halium_halium_arm64.tar.xz"
          echo "[OK] halium_arm64.tar.xz: $(du -sh halium_arm64.tar.xz | cut -f1)"

      - name: Download rootfs.zip from Droidian releases
        run: |
          echo "[*] Finding latest Droidian rootfs release..."
          ROOTFS_URL=$(curl -s https://api.github.com/repos/droidian-images/droidian/releases/latest \
            | python3 -c "import sys,json; assets=json.load(sys.stdin)['assets']; print(next(a['browser_download_url'] for a in assets if 'rootfs-api33-arm64' in a['name'] and a['name'].endswith('.zip')))")
          echo "[*] Downloading $ROOTFS_URL..."
          curl -fSL --retry 3 -o rootfs.zip "$ROOTFS_URL"
          echo "[OK] rootfs.zip: $(du -sh rootfs.zip | cut -f1)"

      - name: Upload to upstream-images release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: upstream-images
          name: "Upstream images (mirrored)"
          body: |
            Mirrored upstream images for the halium build.

            - **halium_arm64.tar.xz** — from [UBports CI](https://ci.ubports.com/job/UBportsCommunityPortsJenkinsCI/job/ubports%252Fporting%252Fcommunity-ports%252Fjenkins-ci%252Fgeneric_arm64/job/halium-13.0/) (contains `system.img`)
            - **rootfs.zip** — from [Droidian releases](https://github.com/droidian-images/droidian/releases) (contains `rootfs.img`)

            Last updated: ${{ github.event.repository.updated_at }}
          files: |
            halium_arm64.tar.xz
            rootfs.zip
          draft: false
          prerelease: false
          make_latest: false
