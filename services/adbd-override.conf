[Service]
# adbd-usb-gadget setup exits early if no UDC at boot (cable not connected),
# leaving FFS unmounted so adbd cannot write descriptors and ep1 never appears.
# Replace it with our script that sets up configfs+FFS without requiring UDC.
# UDC binding is handled by udev (99-adbd-udc.rules) when cable is connected.
ExecStartPre=
ExecStartPre=/usr/local/sbin/adbd-ffs-setup.sh
