[Service]
# Clear TCP socket override — use USB FunctionFS instead
Environment=
ExecStartPre=
ExecStartPost=
ExecStopPost=
# Setup: create FFS gadget config and mount /dev/usb-ffs/adb
ExecStartPre=/usr/lib/android-sdk/platform-tools/adbd-usb-gadget setup
# adbd starts and writes USB descriptors to /dev/usb-ffs/adb/ep0
# Activate: poll for UDC (~110s on Kirin 710) then bind gadget
ExecStartPost=/usr/local/sbin/adbd-udc-wait.sh
# Cleanup on stop
ExecStopPost=/usr/lib/android-sdk/platform-tools/adbd-usb-gadget reset
