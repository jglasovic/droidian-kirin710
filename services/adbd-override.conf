[Service]
# Clear defaults from the stock adbd unit
Environment=
ExecStartPre=
ExecStartPost=
ExecStopPost=
# Setup: create configfs gadget structure and mount /dev/usb-ffs/adb
# Safe without a cable connected — does NOT touch UDC
ExecStartPre=/usr/local/sbin/adbd-ffs-setup.sh
# adbd starts and writes USB descriptors to /dev/usb-ffs/adb/ep0
# Wait for UDC (cable) + descriptors written, then bind gadget
ExecStartPost=/usr/local/sbin/adbd-udc-wait.sh
# Cleanup on stop: unbind UDC and remove gadget config
ExecStopPost=/usr/local/sbin/adbd-ffs-teardown.sh
